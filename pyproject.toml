[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-lab"
version = "0.2.1"
description = "Auditable carry execution, forward paper validation, and chronological regime research"
readme = "README.md"
authors = [{name = "Panagiotis Baltas"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scipy>=1.12,<2",
  "scikit-learn>=1.5,<2",
  "hmmlearn==0.3.3",
  "matplotlib>=3.8,<4",
  "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
market = ["yfinance>=0.2.54,<2"]
statarb = ["osqp>=1.1,<2", "yfinance>=0.2.54,<2", "requests>=2.31,<3", "lxml>=5,<7"]
dev = ["pytest>=8,<10"]

[project.scripts]
regime-lab = "regime_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

