name: Publish curated research reports

# Publishing is deliberate; normal pushes only run the offline verification CI.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/configure-pages@v5
      - run: python scripts/build_site.py --output outputs/site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: outputs/site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy curated reports
        id: deployment
        uses: actions/deploy-pages@v4
