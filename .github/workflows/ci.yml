name: Reproduce research machinery
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python scripts/reproduce.py demo --output outputs/ci_demo
      - run: python scripts/build_site.py --output outputs/site
      - run: python -m pip wheel --no-build-isolation --no-deps . --wheel-dir dist
      - run: python -c "from setuptools.build_meta import build_sdist; build_sdist('dist')"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-${{ matrix.os }}
          path: outputs/ci_demo/
      - uses: actions/upload-artifact@v4
        with:
          name: publication-${{ matrix.os }}
          path: |
            outputs/site/
            dist/
